<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: rgba(30, 41, 59, 0.9);
        --primary: #22d3ee;
        --primary-dark: #0891b2;
        --text: #f8fafc;
        --muted: #94a3b8;
        --line: #334155;
        --done: #64748b;
        --shadow: 0 24px 60px rgba(2, 6, 23, 0.45);
      }

      body.light-theme {
        --bg: #ecfeff;
        --card: rgba(255, 255, 255, 0.92);
        --primary: #0891b2;
        --primary-dark: #0e7490;
        --text: #164e63;
        --muted: #64748b;
        --line: #bae6fd;
        --done: #94a3b8;
        --shadow: 0 24px 60px rgba(14, 116, 144, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 15% 15%, #164e63, transparent 38%),
          radial-gradient(circle at 85% 85%, #312e81, transparent 35%),
          linear-gradient(135deg, #0f172a, #111827);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
        transition:
          background 0.3s ease,
          color 0.3s ease;
      }

      body.light-theme {
        background:
          radial-gradient(circle at 15% 15%, #a5f3fc, transparent 38%),
          radial-gradient(circle at 85% 85%, #ddd6fe, transparent 35%),
          linear-gradient(135deg, #ecfeff, #f8fafc);
      }

      .todo-card {
        width: min(92vw, 500px);
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 28px 24px 20px;
        border: 1px solid color-mix(in srgb, var(--primary) 28%, transparent);
        backdrop-filter: blur(14px);
        transition:
          background 0.3s ease,
          box-shadow 0.3s ease;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .theme-toggle {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: transparent;
        color: var(--text);
        padding: 7px 10px;
        cursor: pointer;
        font-size: 1rem;
      }

      .theme-toggle:hover {
        background: var(--line);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.2rem);
      }

      .count {
        background: #312e81;
        color: #ddd6fe;
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .new-task {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }

      .new-task input {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease;
        background: var(--card);
        color: var(--text);
      }

      .new-task input:focus {
        border-color: var(--primary);
      }

      .new-task button {
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        padding: 0 18px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .new-task button:hover {
        background: var(--primary-dark);
      }

      .tasks {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }

      .task {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        background: color-mix(in srgb, var(--card) 72%, var(--line));
      }

      .task-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .task input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--primary);
      }

      .task label {
        font-size: 1rem;
        word-break: break-word;
      }

      .task.done label {
        color: var(--done);
        text-decoration: line-through;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 64px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .tag.work {
        background: #312e81;
        color: #c4b5fd;
      }

      .tag.home {
        background: #064e3b;
        color: #6ee7b7;
      }

      .tag.study {
        background: #78350f;
        color: #fcd34d;
      }
    </style>
  </head>
  <body>
    <main class="todo-card">
      <div class="header">
        <h1>Todo List</h1>
        <span class="count">3 tasks</span>
      </div>

      <div class="new-task">
        <input
          type="text"
          placeholder="Add a new task"
          aria-label="Add a new task"
        />
        <button type="button">Add</button>
      </div>

      <ul class="tasks">
        <li class="task">
          <div class="task-left">
            <input type="checkbox" id="task1" />
            <label for="task1">Finish project proposal</label>
          </div>
          <span class="tag work">Work</span>
        </li>

        <li class="task done">
          <div class="task-left">
            <input type="checkbox" id="task2" checked />
            <label for="task2">Buy groceries</label>
          </div>
          <span class="tag home">Home</span>
        </li>

        <li class="task">
          <div class="task-left">
            <input type="checkbox" id="task3" />
            <label for="task3">Review math notes</label>
          </div>
          <span class="tag study">Study</span>
        </li>
      </ul>
    </main>

    <script>
      const input = document.querySelector(".new-task input");
      const addButton = document.querySelector(".new-task button");
      const tasks = document.querySelector(".tasks");
      const count = document.querySelector(".count");

      function updateCount() {
        const total = tasks.children.length;
        count.textContent = `${total} task${total === 1 ? "" : "s"}`;
      }

      function addTask() {
        const text = input.value.trim();
        if (!text) return;

        const id = `task-${Date.now()}`;
        const task = document.createElement("li");
        task.className = "task";
        task.innerHTML = `
          <div class="task-left">
            <input type="checkbox" id="${id}" />
            <label for="${id}"></label>
          </div>
          <span class="tag work">Work</span>
        `;
        task.querySelector("label").textContent = text;
        tasks.appendChild(task);
        input.value = "";
        input.focus();
        updateCount();
      }

      addButton.addEventListener("click", addTask);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") addTask();
      });
      tasks.addEventListener("change", (event) => {
        if (event.target.matches('input[type="checkbox"]')) {
          event.target
            .closest(".task")
            .classList.toggle("done", event.target.checked);
        }
      });
    </script>
  </body>
</html>
