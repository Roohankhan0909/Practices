<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #5b8def;
        --primary-dark: #3d6fe6;
        --text: #1f2937;
        --muted: #6b7280;
        --line: #e5e7eb;
        --done: #a7b7c9;
        --shadow: 0 18px 40px rgba(31, 41, 55, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #eef4ff, #f9fafb);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .todo-card {
        width: min(92vw, 500px);
        background: var(--card);
        border-radius: 20px;
        box-shadow: var(--shadow);
        padding: 28px 24px 20px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 3vw, 2.2rem);
      }

      .count {
        background: #edf3ff;
        color: var(--primary-dark);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .new-task {
        display: flex;
        gap: 10px;
        margin-bottom: 18px;
      }

      .new-task input {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease;
      }

      .new-task input:focus {
        border-color: var(--primary);
      }

      .new-task button {
        border: none;
        border-radius: 12px;
        background: var(--primary);
        color: #fff;
        font-weight: 700;
        padding: 0 18px;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .new-task button:hover {
        background: var(--primary-dark);
      }

      .tasks {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }

      .task {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        background: #fbfcff;
      }

      .task-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .task input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--primary);
      }

      .task label {
        font-size: 1rem;
        word-break: break-word;
      }

      .task.done label {
        color: var(--done);
        text-decoration: line-through;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 64px;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .tag.work {
        background: #eaf2ff;
        color: #3a68d9;
      }

      .tag.home {
        background: #ebf9f0;
        color: #2a8f5b;
      }

      .tag.study {
        background: #fff4dd;
        color: #b87700;
      }
    </style>
  </head>
  <body>
    <main class="todo-card">
      <div class="header">
        <h1>Todo List</h1>
        <span class="count">3 tasks</span>
      </div>

      <div class="new-task">
        <input type="text" placeholder="Add a new task" aria-label="Add a new task" />
        <button type="button">Add</button>
      </div>

      <ul class="tasks">
        <li class="task">
          <div class="task-left">
            <input type="checkbox" id="task1" />
            <label for="task1">Finish project proposal</label>
          </div>
          <span class="tag work">Work</span>
        </li>

        <li class="task done">
          <div class="task-left">
            <input type="checkbox" id="task2" checked />
            <label for="task2">Buy groceries</label>
          </div>
          <span class="tag home">Home</span>
        </li>

        <li class="task">
          <div class="task-left">
            <input type="checkbox" id="task3" />
            <label for="task3">Review math notes</label>
          </div>
          <span class="tag study">Study</span>
        </li>
      </ul>
    </main>
  </body>
</html>
